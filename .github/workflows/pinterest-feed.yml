name: Pinterest feed
# Adds scheduled pins to the RSS feeds at 7:30am, 12:30pm and 7:30pm Sydney (AEDT = UTC+11)
on:
  schedule:
    - cron: "30 20 * * *"   # 7:30am Sydney
    - cron: "30 1 * * *"    # 12:30pm Sydney
    - cron: "30 8 * * *"    # 7:30pm Sydney
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build_feed.py
      - name: Commit updated feeds
        run: |
          git config user.name "wearhue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed-*.xml
          if git diff --cached --quiet; then echo "nothing new"; echo "changed=no" >> $GITHUB_OUTPUT; else git commit -m "Pinterest feed: add scheduled pins" && git push && echo "changed=yes" >> $GITHUB_OUTPUT; fi
        id: commit
      - name: Republish the site
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || echo "Pages will rebuild on its own"
